# Production overlay.
#
#   kubectl apply -k infra/k8s/overlays/production
#
# Adds pinned images, production resource reservations and the TLS ingress on
# top of the base manifests (see ingress.yaml). Secrets are NOT overridden
# here — supply them with an external secrets manager rather than committing
# them to a ConfigMap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homobio

resources:
  - ../../base
  - ingress.yaml

patches:
  # Production images are pinned, not floating tags.
  - target:
      kind: Deployment
      name: fhe-coprocessor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/example/homobio-fhe-coprocessor:v2.0.0
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/example/homobio-gateway:v2.0.0

  - target:
      kind: Deployment
      name: fhe-coprocessor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "2"
            memory: 2Gi
          limits:
            cpu: "8"
            memory: 8Gi