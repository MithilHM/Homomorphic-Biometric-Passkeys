[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["node_modules", "lib"]
test = "contracts/test"
cache_path = "cache_forge"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# The contracts must never read `block.timestamp` to decide anything an attacker
# can influence cheaply; more importantly, `msg.value` / `tx.origin` must not
# appear at all. Both are banned so a reviewer never has to ask.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[profile.ci]
verbosity = 3
# No gas snapshots: they churn on every solc patch release and train reviewers
# to ignore them. Size limits are asserted in `scripts/check-sizes.mjs`.